{{- $kafka := .Values.secrets.kafka | default dict -}}
{{- $extra := index .Values.secrets "secret-key-values" | default dict -}}
{{- $hasKafka := or $kafka.username $kafka.password -}}
{{- if or $hasKafka $extra }}
{{- $conjurEnabled := .Values.secrets.conjur.enabled | default false }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plateau-gaia-bfa.fullname" . }}-secret
  labels:
    {{- include "plateau-gaia-bfa.labels" . | nindent 4 }}
type: Opaque
{{- if $conjurEnabled }}
{{- /*
  Conjur mode: every value below MUST be a "Vault/Conjur/..." reference. The
  authenticator init container (see deployment.yaml) resolves these paths and
  rewrites this Secret's keys in place before the main container starts.
*/}}
stringData:
  conjur-map: |-
    {{- if $kafka.username }}
    {{- if not (hasPrefix "Vault" (toString $kafka.username)) }}
    {{- fail (printf "ERROR: Conjur enabled, secrets.kafka.username must start with 'Vault'. Current: %s" $kafka.username) }}
    {{- end }}
    KAFKA_SASL_USERNAME: {{ $kafka.username }}
    {{- end }}
    {{- if $kafka.password }}
    {{- if not (hasPrefix "Vault" (toString $kafka.password)) }}
    {{- fail (printf "ERROR: Conjur enabled, secrets.kafka.password must start with 'Vault'. Current: %s" $kafka.password) }}
    {{- end }}
    KAFKA_SASL_PASSWORD: {{ $kafka.password }}
    {{- end }}
    {{- range $key, $value := $extra }}
    {{- if not (hasPrefix "Vault" (toString $value)) }}
    {{- fail (printf "ERROR: Conjur enabled, secret-key-values '%s' must start with 'Vault'. Current: %s" $key $value) }}
    {{- end }}
    {{ $key }}: {{ $value }}
    {{- end }}
{{- else }}
stringData:
  {{- if $kafka.username }}
  KAFKA_SASL_USERNAME: {{ $kafka.username | quote }}
  {{- end }}
  {{- if $kafka.password }}
  KAFKA_SASL_PASSWORD: {{ $kafka.password | quote }}
  {{- end }}
  {{- range $key, $value := $extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
